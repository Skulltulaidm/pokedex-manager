name: pokedex

services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pokedex}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pokedex}
      POSTGRES_DB: ${POSTGRES_DB:-pokedex}
    ports:
      # Loopback only: the default credentials are weak and publishing on 0.0.0.0
      # would expose the database to anything on the same network.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      # postgres:18 declares its VOLUME at /var/lib/postgresql, not the
      # /var/lib/postgresql/data path used by 17 and earlier.
      - pgdata:/var/lib/postgresql
      # Runs once, only when pgdata is empty.
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-pokedex} -d ${POSTGRES_DB:-pokedex}",
        ]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./apps/api
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-pokedex}:${POSTGRES_PASSWORD:-pokedex}@db:5432/${POSTGRES_DB:-pokedex}
      # The issuer is what the token claims and the browser sees; the JWKS URL is
      # how this container reaches the web service. They differ on purpose.
      AUTH_ISSUER: ${BETTER_AUTH_URL:-http://localhost:3000}
      AUTH_AUDIENCE: ${BETTER_AUTH_URL:-http://localhost:3000}
      AUTH_JWKS_URL: http://web:3000/api/auth/jwks
      MCP_RESOURCE_URL: http://localhost:${API_PORT:-8010}/mcp
      MCP_INTERNAL_URL: http://127.0.0.1:8000/mcp
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      AGENT_MODEL: ${AGENT_MODEL:-google-gla:gemini-flash-latest}
      VISION_MODEL: ${VISION_MODEL:-google-gla:gemini-flash-latest}
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434/v1}
    ports:
      - "127.0.0.1:${API_PORT:-8010}:8000"
    volumes:
      - scan_images:/data/scans
    extra_hosts:
      # Lets the container reach an Ollama running on the host.
      - "host.docker.internal:host-gateway"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:${API_PORT:-8010}
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-pokedex}:${POSTGRES_PASSWORD:-pokedex}@db:5432/${POSTGRES_DB:-pokedex}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3000}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET in .env}
      API_INTERNAL_URL: http://api:8000
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"

volumes:
  pgdata:
  scan_images:
